<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Annu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="confetti-canvas-wrap"><canvas id="confetti"></canvas></div>

    <main class="birthday-page">
      <section class="card">
        <div class="photo-frame">
          <img
            src="WhatsApp Image 2026-10-13 at 10.50.35 PM.jpeg"
            alt="Annu enjoying the beach"
          />
        </div>

        <h1>Happy Birthday, Annu 🎉</h1>
        <p class="subtitle">हमारी प्यारी अन्नू — तुम्हें ढेर सारी खुशियाँ मिले।</p>

        <div class="actions">
          <button id="loveButton">Send Love ❤️</button>
        </div>

        <p id="wishText" class="wish-text">तुम हमेशा खुश रहो ✨</p>
      </section>
    </main>

    <!-- Welcome modal that appears on open -->
    <div id="welcomeModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h2>Happy Birthday, Annu!</h2>
        <p class="modal-sub">आज का दिन बहुत खास — चलो जश्न मनाएँ 🎈</p>
        <button id="startButton" class="primary">Celebrate</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
